# CRITERIO AI — CONFIGURACIÓN DE PRODUCCIÓN NETLIFY
# Generado por DevOps Automator
# Dominio: gocriterio.com

[build]
  publish = "dist"
  command = "npm run build"

# Detección de Formularios de Netlify
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

# Caché de 7 días para OpenGraph y assets estáticos versionados
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Cabeceras de Seguridad Globales
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;"

# Redirecciones Limpias y 404 Personalizado
[[redirects]]
  from = "/briefing"
  to = "/briefing/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
